# OpenTelemetry Collector — reference config for IthraCode VPS stack
# Docs only. Adjust endpoints/credentials for your infra.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki]

# Prometheus scrape targets (external to collector):
# - OTEL app metrics: http://app-host:9464/metrics
# - Collector prometheus exporter: http://collector-host:8889/metrics

# Grafana datasources:
# - Prometheus → collector:8889 + app :9464
# - Tempo → collector OTLP trace backend
# - Loki → collector logs pipeline
